<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سامانه ثبت درخواست و ارسال پیامک</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Tahoma', 'IranSans', sans-serif;
  background: #f0f2f0;
  padding: 20px;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

.box {
  max-width: 750px;
  width: 100%;
  margin: 20px auto;
  background: #ffffff;
  padding: 30px 28px;
  border-radius: 12px;
  box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
  border: 1px solid #e5e7eb;
}

#loginBox h2 {
  text-align: center;
  color: #0a2a1a;
  margin-bottom: 24px;
  border-bottom: 3px solid #b8963a;
  padding-bottom: 12px;
}

#loginBox input {
  width: 100%;
  padding: 14px 16px;
  margin: 8px 0;
  border: 2px solid #d1d5db;
  border-radius: 8px;
  font-size: 15px;
  outline: none;
  transition: 0.2s;
}

#loginBox input:focus {
  border-color: #0a2a1a;
  box-shadow: 0 0 0 3px rgba(10, 42, 26, 0.08);
}

#loginBox button {
  width: 100%;
  padding: 14px;
  background: #0a2a1a;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
  transition: 0.2s;
  margin-top: 12px;
}

#loginBox button:hover {
  background: #1a4a2a;
}

#panel h2 {
  text-align: center;
  color: #0a2a1a;
  border-bottom: 3px solid #b8963a;
  padding-bottom: 12px;
  margin-bottom: 20px;
}

#panel h3 {
  color: #0a2a1a;
  margin: 20px 0 12px;
  font-size: 16px;
}

label {
  display: block;
  font-weight: 600;
  font-size: 13px;
  color: #0a2a1a;
  margin-top: 10px;
  margin-bottom: 2px;
}

input, select, textarea, button {
  width: 100%;
  padding: 12px 14px;
  margin: 4px 0;
  border: 2px solid #d1d5db;
  border-radius: 8px;
  font-size: 14px;
  outline: none;
  font-family: inherit;
  transition: 0.2s;
  box-sizing: border-box;
}

input:focus, select:focus, textarea:focus {
  border-color: #0a2a1a;
  box-shadow: 0 0 0 3px rgba(10, 42, 26, 0.08);
}

textarea {
  resize: vertical;
  min-height: 100px;
}

button {
  cursor: pointer;
  font-weight: 700;
  background: #0a2a1a;
  color: #fff;
  border: none;
  transition: 0.2s;
}

button:hover {
  background: #1a4a2a;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.btn-danger {
  background: #991b1b;
}

.btn-danger:hover {
  background: #7a1515;
}

.btn-success {
  background: #166534;
}

.btn-success:hover {
  background: #0f4a2a;
}

hr {
  margin: 20px 0;
  border: none;
  border-top: 2px solid #e5e7eb;
}

.status-msg {
  padding: 12px 16px;
  border-radius: 8px;
  margin: 10px 0;
  display: none;
  font-weight: 600;
  text-align: center;
}

.status-msg.success {
  display: block;
  background: #ecfdf5;
  color: #166534;
  border: 2px solid #6ee7b7;
}

.status-msg.error {
  display: block;
  background: #fef2f2;
  color: #991b1b;
  border: 2px solid #fca5a5;
}

.status-msg.loading {
  display: block;
  background: #ebf8ff;
  color: #065f46;
  border: 2px solid #a7f3d0;
}

@media (max-width: 640px) {
  body {
    padding: 10px;
  }
  .box {
    padding: 18px 16px;
  }
  input, select, textarea, button {
    padding: 10px 12px;
    font-size: 14px;
  }
}

.hidden {
  display: none !important;
}
</style>
</head>
<body>

<!-- ===== لاگین ===== -->
<div class="box" id="loginBox">
  <h2>🔐 ورود به سامانه</h2>
  <label>نام کاربری</label>
  <input id="username" placeholder="نام کاربری" value="Admin" />
  <label>رمز عبور</label>
  <input id="password" type="password" placeholder="رمز عبور" value="Admin90" />
  <button onclick="login()">ورود</button>
  <div id="loginError" style="color:#991b1b;text-align:center;margin-top:10px;display:none;font-weight:600;">❌ نام کاربری یا رمز عبور اشتباه است</div>
</div>

<!-- ===== پنل اصلی ===== -->
<div class="box hidden" id="panel">

  <h2>📋 سامانه ثبت درخواست و ارسال پیامک</h2>

  <label>📱 شماره موبایل (مقصد)</label>
  <input id="mobile" placeholder="مثال: ۰۹۱۲۳۴۵۶۷۸۹" />

  <label>👤 نام و نام خانوادگی</label>
  <input id="name" placeholder="مثال: علیرضا عوض آقائی" />

  <label>🆔 کد ملی</label>
  <input id="meli" placeholder="مثال: ۲۴۲۰۴۵۴۰۵۷" />

  <label>🔑 شناسه</label>
  <input id="shenase" placeholder="کد پیگیری یا شناسه" />

  <label>🎓 مقطع تحصیلی</label>
  <input id="maghta" placeholder="مثال: کارشناسی / کارشناسی ارشد / دکتری" />

  <label>📚 رشته تحصیلی</label>
  <input id="reshte" placeholder="مثال: فیزیولوژی ورزشی" />

  <label>🏢 واحد / دانشگاه</label>
  <select id="unit"></select>

  <label>📌 وضعیت درخواست</label>
  <select id="status">
    <option value="registered">✅ ثبت گردید</option>
    <option value="review">⏳ در حال بررسی می‌باشد</option>
    <option value="referred">📤 به واحد مربوطه ارجاع داده شد</option>
    <option value="approved">✔️ تایید نهایی شد</option>
    <option value="rejected">❌ رد شد</option>
  </select>

  <h3>🏛️ مدیریت واحدها</h3>
  <div style="display:flex;gap:10px;flex-wrap:wrap;">
    <input id="newUnit" placeholder="نام واحد جدید" style="flex:1;min-width:150px;" />
    <button onclick="addUnit()" style="flex:0 0 auto;padding:12px 20px;">➕ افزودن</button>
    <button onclick="removeUnit()" class="btn-danger" style="flex:0 0 auto;padding:12px 20px;">🗑️ حذف آخرین</button>
  </div>

  <hr>

  <div style="display:flex;gap:10px;flex-wrap:wrap;">
    <button id="actionBtn" onclick="makeText()" style="flex:2;">📝 ایجاد متن و ارسال پیامک</button>
    <button onclick="copyText()" class="btn-success" style="flex:1;">📋 کپی متن</button>
  </div>

  <label>📄 متن تولید شده</label>
  <textarea id="out" rows="6" readonly></textarea>

  <div id="statusMsg" class="status-msg"></div>

  <button onclick="logout()" class="btn-danger" style="margin-top:16px;">🚪 خروج از حساب</button>
</div>

<script>
// ============================================================
//  🔑 اطلاعات اتصال به اس‌ام‌اس‌آی‌آر (جایگزین شده)
// ============================================================
const SMS_CONFIG = {
  apiKey: "j60P5eTT97CROz8MdumlgNmA2WBC2E",
  templateCode: "943542",
  lineNumber: "",
  apiUrl: "https://api.sms.ir/v1/send"
};

// ============================================================
//  👤 اطلاعات لاگین (جایگزین شده)
// ============================================================
const LOGIN = {
  username: "Admin",
  password: "Admin90"
};

// ============================================================
//  🏢 مدیریت واحدها
// ============================================================
let units = JSON.parse(
  localStorage.getItem("units") ||
  '["تهران مرکزی","تهران جنوب","شیراز","کرمانشاه","اصفهان","تبریز"]'
);

function renderUnits() {
  const s = document.getElementById("unit");
  s.innerHTML = "";
  units.forEach(function(u) {
    const o = document.createElement("option");
    o.value = u;
    o.textContent = u;
    s.appendChild(o);
  });
  localStorage.setItem("units", JSON.stringify(units));
}

function addUnit() {
  const v = document.getElementById("newUnit").value.trim();
  if (v && !units.includes(v)) {
    units.push(v);
    renderUnits();
    document.getElementById("newUnit").value = "";
    showStatus("✅ واحد جدید افزوده شد", "success");
  } else if (v && units.includes(v)) {
    showStatus("⚠️ این واحد قبلاً وجود دارد", "error");
  } else {
    showStatus("⚠️ لطفاً نام واحد را وارد کنید", "error");
  }
}

function removeUnit() {
  if (units.length > 1) {
    const removed = units.pop();
    renderUnits();
    showStatus(`🗑️ واحد "${removed}" حذف شد`, "success");
  } else {
    showStatus("⚠️ حداقل یک واحد باید وجود داشته باشد", "error");
  }
}

renderUnits();

// ============================================================
//  🔐 توابع لاگین
// ============================================================
function login() {
  const u = document.getElementById("username").value.trim();
  const p = document.getElementById("password").value.trim();
  const error = document.getElementById("loginError");

  if (u === LOGIN.username && p === LOGIN.password) {
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("panel").classList.remove("hidden");
    error.style.display = "none";
    showStatus("✅ خوش آمدید! سامانه آماده است.", "success");
  } else {
    error.style.display = "block";
  }
}

function logout() {
  if (confirm("آیا از خروج مطمئن هستید؟")) {
    document.getElementById("panel").classList.add("hidden");
    document.getElementById("loginBox").style.display = "block";
    document.getElementById("username").value = "";
    document.getElementById("password").value = "";
    document.getElementById("loginError").style.display = "none";
    document.getElementById("statusMsg").className = "status-msg";
    document.getElementById("statusMsg").style.display = "none";
  }
}

// ============================================================
//  📊 نمایش وضعیت
// ============================================================
function showStatus(message, type = "success") {
  const el = document.getElementById("statusMsg");
  el.textContent = message;
  el.className = "status-msg " + type;
  el.style.display = "block";
  if (type !== "loading") {
    setTimeout(() => {
      el.style.display = "none";
    }, 5000);
  }
}

// ============================================================
//  📨 ارسال پیامک به اس‌ام‌اس‌آی‌آر
// ============================================================
async function sendSMS(phoneNumber, message) {
  try {
    showStatus("⏳ در حال ارسال پیامک...", "loading");

    const payload = {
      apiKey: SMS_CONFIG.apiKey,
      lineNumber: SMS_CONFIG.lineNumber,
      mobile: phoneNumber,
      templateCode: SMS_CONFIG.templateCode,
      parameters: [
        {
          name: "نام",
          value: document.getElementById("name").value || "متقاضی"
        },
        {
          name: "پیام",
          value: message
        }
      ]
    };

    console.log("📤 ارسال به اس‌ام‌اس‌آی‌آر:", payload);

    const response = await fetch(SMS_CONFIG.apiUrl, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Accept": "application/json"
      },
      body: JSON.stringify(payload)
    });

    const result = await response.json();
    console.log("📥 پاسخ اس‌ام‌اس‌آی‌آر:", result);

    if (response.status === 200 || result.status === 1) {
      showStatus(`✅ پیامک با موفقیت به شماره ${phoneNumber} ارسال شد`, "success");
      return true;
    } else {
      showStatus(`❌ خطا: ${result.message || result.detail || 'خطای ناشناخته'}`, "error");
      return false;
    }

  } catch (error) {
    console.error("❌ خطا:", error);
    showStatus(`❌ خطا: ${error.message}`, "error");
    return false;
  }
}

// ============================================================
//  📝 ساخت متن و ارسال
// ============================================================
async function makeText() {
  const name = document.getElementById("name").value.trim();
  const meli = document.getElementById("meli").value.trim();
  const maghta = document.getElementById("maghta").value.trim();
  const reshte = document.getElementById("reshte").value.trim();
  const unit = document.getElementById("unit").value;
  const shenase = document.getElementById("shenase").value.trim();
  const mobile = document.getElementById("mobile").value.trim();

  const phoneRegex = /^09[0-9]{9}$/;
  if (!phoneRegex.test(mobile)) {
    showStatus("⚠️ شماره موبایل معتبر نیست (مثال: ۰۹۱۲۳۴۵۶۷۸۹)", "error");
    return;
  }

  if (!name || !meli || !maghta || !reshte || !shenase) {
    showStatus("⚠️ لطفاً تمام فیلدهای الزامی را پر کنید", "error");
    return;
  }

  const statusMap = {
    "registered": "ثبت گردید.",
    "review": "در حال بررسی می‌باشد.",
    "referred": "به واحد مربوطه ارجاع داده شد.",
    "approved": "تایید نهایی شد.",
    "rejected": "متاسفانه رد شد."
  };
  const statusValue = document.getElementById("status").value;
  const statusText = statusMap[statusValue] || "ثبت گردید.";

  const text = `متقاضی گرامی آقای/خانم ${name}، درخواست شما با کد ملی ${meli} در مقطع ${maghta} رشته ${reshte}، واحد ${unit} و شناسه ${shenase} ${statusText}`;

  document.getElementById("out").value = text;

  // ارسال پیامک
  await sendSMS(mobile, text);
}

// ============================================================
//  📋 کپی متن
// ============================================================
function copyText() {
  const text = document.getElementById("out").value;
  if (!text) {
    showStatus("⚠️ ابتدا متن را ایجاد کنید", "error");
    return;
  }

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text)
      .then(() => showStatus("✅ متن با موفقیت کپی شد", "success"))
      .catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand("copy");
    showStatus("✅ متن با موفقیت کپی شد", "success");
  } catch (e) {
    showStatus("❌ خطا در کپی متن", "error");
  }
  document.body.removeChild(ta);
}

// ============================================================
//  ⌨️ کلید Enter برای لاگین
// ============================================================
document.getElementById("password").addEventListener("keydown", function(e) {
  if (e.key === "Enter") login();
});
document.getElementById("username").addEventListener("keydown", function(e) {
  if (e.key === "Enter") login();
});

// ============================================================
//  🚀 بارگذاری اولیه
// ============================================================
console.log("🚀 سامانه ثبت درخواست و ارسال پیامک");
console.log("📡 متصل به اس‌ام‌اس‌آی‌آر");
console.log("🔑 API Key:", SMS_CONFIG.apiKey);
console.log("📝 کد قالب:", SMS_CONFIG.templateCode);
</script>

</body>
</html>
