<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ارسال پیامک</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,sans-serif;background:#f1f5f9;color:#0f172a;display:flex;justify-content:center;padding:16px}
.card{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:480px;box-shadow:0 2px 12px #0001;margin-top:20px}
h2{margin:0 0 14px;font-size:18px}
label{display:block;font-size:13px;margin:12px 0 4px;color:#475569}
input{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;font-size:15px}
button{width:100%;margin-top:16px;padding:12px;border:0;border-radius:8px;background:#2563eb;color:#fff;font:inherit;font-size:16px;cursor:pointer}
button.sec{background:#e2e8f0;color:#0f172a;margin-top:8px}
button:disabled{opacity:.6}
.top{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:2px 12px 12px;margin-bottom:14px}
.sms{background:#eef2ff;border:1px solid #c7d2fe;border-radius:12px;padding:14px;font-size:15px;line-height:2.1;margin-top:6px}
.f{background:#fef9c3;border-bottom:2px solid #eab308;border-radius:4px;padding:2px 6px;outline:none;display:inline-block;min-width:30px}
.f:focus{background:#fde68a}
.hint{font-size:12px;color:#64748b;margin-top:6px}
.msg{margin-top:12px;padding:10px;border-radius:8px;font-size:14px;display:none}
.ok{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}
.hide{display:none}
</style>
</head>
<body>

<div class="card" id="app">
  <h2>📨 ارسال پیامک</h2>

  <div class="top">
    <label>API Key</label>
    <input id="key" type="password" dir="ltr">
    <label>کد قالب</label>
    <input id="tpl" inputmode="numeric">
  </div>

  <label>شماره موبایل گیرنده</label>
  <input id="mobile" inputmode="numeric" placeholder="09123456789">

  <label>متن پیامک</label>
  <div class="sms" id="sms"></div>
  <div class="hint">روی بخش‌های زرد کلیک کن و ویرایش کن</div>

  <button id="send">🚀 ارسال</button>
  <div class="msg" id="out"></div>
</div>

<script>
// ===== فقط این بخش را ویرایش کن =====
const API_URL = "https://api.sms.ir/v1/send/verify";
// متن پیامک: هر {0} {1} ... یک بخش قابل ویرایش است
const TEXT = "متقاضی گرامی {0} {1} با کد ملی {2} مدارک شما با شناسه {3} به واحد تکمیلی جهت نهایی شدن ارجاع داده شد.\nواحد مرکز";
// مقدار پیش‌فرض هر بخش
const DEFAULTS = ["آقای", "علی علی‌زاده", "۰۰۰۰۰۰۰۰۰", "۷۵۷۵۷۶"];
// اسم پارامترها در قالب sms.ir (به همان ترتیب بالا)
const PARAMS = ["TITLE", "NAME", "NATIONALCODE", "ID"];
// ====================================

const $ = id => document.getElementById(id);

["key","tpl"].forEach(k=>{
  try{ const v=localStorage.getItem("sms_"+k); if(v) $(k).value=v; }catch(e){}
  $(k).addEventListener("input",()=>{ try{localStorage.setItem("sms_"+k,$(k).value.trim())}catch(e){} });
});

// ساخت متن با بخش‌های قابل ویرایش
const box=$("sms");
TEXT.split(/(\{\d+\})/).forEach(p=>{
  const m=p.match(/^\{(\d+)\}$/);
  if(m){
    const s=document.createElement("span");
    s.className="f"; s.contentEditable="true"; s.dataset.i=m[1];
    s.textContent=DEFAULTS[m[1]]||"";
    s.onkeydown=e=>{ if(e.key==="Enter") e.preventDefault(); };
    s.onpaste=e=>{ e.preventDefault(); document.execCommand("insertText",false,(e.clipboardData.getData("text")||"").replace(/\n/g," ")); };
    box.appendChild(s);
  } else {
    p.split("\n").forEach((line,i)=>{ if(i) box.appendChild(document.createElement("br")); box.appendChild(document.createTextNode(line)); });
  }
});

function msg(t,c){ const o=$("out"); o.textContent=t; o.className="msg "+c; o.style.display="block"; }

$("send").onclick=async()=>{
  const key=$("key").value.trim(), tpl=$("tpl").value.trim(), mobile=$("mobile").value.trim();
  if(!key) return msg("API Key را وارد کن","err");
  if(!tpl) return msg("کد قالب را وارد کن","err");
  if(!/^09\d{9}$/.test(mobile)) return msg("شماره موبایل معتبر نیست","err");
  const parameters=[...box.querySelectorAll(".f")].map(s=>({name:PARAMS[s.dataset.i],value:s.textContent.trim()}));
  if(parameters.some(p=>!p.value)) return msg("همه بخش‌های زرد باید پر باشند","err");
  $("send").disabled=true; msg("در حال ارسال...","ok");
  try{
    const r=await fetch(API_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json","Accept":"application/json","x-api-key":key},
      body:JSON.stringify({mobile,templateId:Number(tpl),parameters})
    });
    const d=await r.json().catch(()=>({}));
    if(r.ok&&d.status===1) msg("✅ ارسال شد","ok");
    else msg("❌ خطا: "+(d.message||r.status),"err");
  }catch(e){ msg("❌ ارتباط برقرار نشد (احتمالاً CORS)","err"); }
  $("send").disabled=false;
};
</script>
</body>
</html>
